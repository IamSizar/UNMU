org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter engine jars are AndroidX already; jetifying them runs out of heap on AGP 8.11.
android.jetifier.ignorelist=.*arm64_v8a_.*,.*armeabi_v7a_.*,.*x86_64_.*,.*flutter_embedding_.*

# Network timeout configuration for downloads
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.http.maxRetries=5
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
